name: Code duplication
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: code-duplication-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  duplication:
    name: Code duplication / Duplicate detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/code-duplication@c188397b9147dbf21030cf2f3e4fc41bff37358b
