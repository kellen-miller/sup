name: Rust

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/rust-check@9478f2f23f217048a86cb1916fb78b312f20afa7
        with:
          checks: fmt

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/rust-check@9478f2f23f217048a86cb1916fb78b312f20afa7
        with:
          checks: clippy

  tests-linux:
    name: Rust Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/rust-check@9478f2f23f217048a86cb1916fb78b312f20afa7
        with:
          checks: test build
          build-profile: release

  tests-macos:
    name: Rust Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/rust-check@9478f2f23f217048a86cb1916fb78b312f20afa7
        with:
          checks: test build
          build-profile: release

  yaml:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Lint YAML
        run: uvx yamllint==1.38.0 --strict .
