name: Repository validation
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shared-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflows:
    name: GitHub Actions
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@eb1a4f5900aaa6468cffb67513da61078265ba26
  renovate:
    name: Renovate
    uses: kellen-miller/ci/.github/workflows/renovate-config-validator.yaml@eb1a4f5900aaa6468cffb67513da61078265ba26
  duplication:
    name: Code duplication (CPD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: kellen-miller/ci/.github/actions/code-duplication@eb1a4f5900aaa6468cffb67513da61078265ba26
