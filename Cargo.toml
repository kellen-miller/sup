[package]
name = "sup"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "sup"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
libc = "0.2"
nix = { version = "0.31", features = ["socket", "user", "resource", "term"] }
zeroize = "1.9"
getrandom = "0.4"
tempfile = "3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
vte = { version = "0.15", default-features = false }
